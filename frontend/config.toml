# Frontend stage configuration: upload a floor plan, see the generated missing
# component and what YOLO makes of it.
#
# Paths, devices and dataset locations only - every tunable number lives in
# frontend/hyperparameters.toml.
#
# This stage trains nothing and writes nothing outside frontend/uploads and
# frontend/outputs. It is a thin UI over the machinery the evaluator already
# uses: mask_diffusion/inference.py (encode, sample, decode) plus
# evaluator/compositor.py (the image the detector judges) and
# evaluator/yolo_eval.py (the detector call).

[default]
DEBUG_LOG_FILE_PATH = "./debug_logs/frontend.log"
UPLOAD_DIRECTORY = "./frontend/uploads/"
OUTPUT_DIRECTORY = "./frontend/outputs/"
DEVICE = "cuda"

# ---------------------------------------------------------------------------
# The missing-component run that answers an upload.
# ---------------------------------------------------------------------------
# Default component selected by the upload form (tv, showcase, dining_set, ...).
# The form's dropdown overrides it. The selected component resolves BOTH models
# from components.toml at the repository root: its diffusion checkpoint and the
# missing_yolo detector trained for it.
MISSING_COMPONENT_CLASS_NAME = "tv"
# Group prefix the target VAE layout's class names carry.
TARGET_CLASS_GROUP_PREFIX = "furniture"

# Mask filenames an upload is renamed to before it reaches the frozen encoders.
# The pipeline deliberately reads ONE file name per role, so the uploaded pair
# and the dataset's own samples are encoded identically.
FLOORPLAN_MASK_FILE = "floorplan_segmentation.png"
FURNITURE_MASK_FILE = "furniture_segmentation.png"

# Color index JSONs describing each mask's classes (used for rendering and for
# validating that an upload is a class-id mask of the expected range).
MASK_COLOR_INDEX_DIR = "./Color-index"
FLOORPLAN_COLOR_INDEX_FILE = "floorplan_color_index.json"
FURNITURE_COLOR_INDEX_FILE = "furniture_color_index.json"

# ---------------------------------------------------------------------------
# Detector ontology aliases.
# ---------------------------------------------------------------------------
# The detector's own class names are read from the selected weights (one class
# for a missing_yolo model, ten for the multi-class YOLO model). This file only
# supplies aliases that bridge mask names to class names (dining_set ->
# Dining_table), so a box label can never come from the wrong vocabulary.
YOLO_HYPERPARAMETERS_PATH = "./YOLO/hyperparameters.toml"

[debug]
IS_DEBUG = true
IS_DEBUG_TORCH = false

[prod]
IS_DEBUG = false
IS_DEBUG_TORCH = false
