# Evaluator stage configuration: judge YOLO on the missing component that
# mask_diffusion generates.
#
# Paths, devices and dataset locations only - every tunable number lives in
# evaluator/hyperparameters.toml.
#
# The evaluator is a MEASUREMENT, not a training stage: the selected missing
# component (components.toml at the repository root) supplies one trained
# mask_diffusion checkpoint and the missing_yolo detector trained for that same
# component. It rebuilds every test sample as (real layout without the missing
# component + the generated component), lets the detector see that image and
# scores only the missing component. Nothing here is trained and nothing
# outside evaluator/outputs is written to.

[default]
DEBUG_LOG_FILE_PATH = "./debug_logs/evaluator.log"
OUTPUT_SAMPLES_DIRECTORY = "./evaluator/outputs/"
TELEMETRY_LOG_DIRECTORY = "./evaluator/telemetry_logs/"
DEVICE = "mps"

# Name of the missing component, resolved against the target VAE layout to find
# its channel. This is also the default component SELECTION: components.toml
# (at the repository root) supplies the matching diffusion checkpoint and the
# matching missing_yolo detector weights. `--component` overrides this key, and
# `--checkpoint` / `--weights` override the selected models individually.
# Never a channel index: changing the component is this one key plus the label
# names in hyperparameters.toml.
MISSING_COMPONENT_CLASS_NAME = "tv"
# Group prefix the target layout's class names carry ("furniture/tv"); set to ""
# for an unprefixed color index.
TARGET_CLASS_GROUP_PREFIX = "furniture"

# folder-per-sample test split. Every sample is evaluated, including the ones
# that contain no missing component at all: those measure YOLO's false-positive
# behaviour on the generated component, which is part of the answer.
TEST_IMAGES_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/test"

# Folder-per-sample validation split used by the qualitative full-pipeline
# report (evaluator/visualization_full_pipeline_report.py). It is
# generator-unseen, so the report is an honest held-out picture rather than a
# training sample.
VALIDATION_IMAGES_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/validate"

# Destination of the qualitative full-pipeline report. One PNG per selected
# component plus per-sample panels and a JSON manifest are written inside.
FULL_PIPELINE_OUTPUT_DIRECTORY = "./evaluator/outputs/full_pipeline_report/"

# Mask filenames inside each sample folder (both are read by the frozen VAEs;
# the missing component is removed by the partial VAE's layout, never by
# editing pixels here).
FLOORPLAN_MASK_FILE = "floorplan_segmentation.png"
FURNITURE_MASK_FILE = "furniture_segmentation.png"

# Directory holding the color index JSONs (dataset root, next to the splits).
# Falls back to the parent of TEST_IMAGES_DIR when a file is missing there.
MASK_COLOR_INDEX_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work"
FLOORPLAN_COLOR_INDEX_FILE = "floorplan_color_index.json"
FURNITURE_COLOR_INDEX_FILE = "furniture_color_index.json"

# The dataset's own label file inside each sample folder: the ground truth the
# missing component's boxes are read from, never a segmentation mask.
GROUND_TRUTH_LABEL_FILE = "labels.txt"

# ---------------------------------------------------------------------------
# Detector ontology aliases.
# ---------------------------------------------------------------------------
# The detector's own CLASS NAMES are read from the selected weights (a
# missing_yolo model has one class with id 0; the multi-class YOLO model has
# ten). This file supplies only the aliases that bridge mask names to class
# names (e.g. dining_set -> Dining_table), so a class id can never be resolved
# against a vocabulary the weights did not learn.
YOLO_HYPERPARAMETERS_PATH = "./YOLO/hyperparameters.toml"

[debug]
IS_DEBUG = true
IS_DEBUG_TORCH = false

[prod]
IS_DEBUG = false
IS_DEBUG_TORCH = false
