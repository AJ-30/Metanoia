# missing_yolo hyperparameters (missing_yolo/runner.py, via
# ./train_missing_yolo.sh). Every tunable number lives here - never in .py.
#
# Pipeline in one paragraph: the missing component is a hyperparameter. Every
# epoch, each train sample's image is regenerated by the frozen mask_diffusion
# generator conditioned on its GT floorplan and on its GT layout with that
# component erased, decoded through the frozen arrangement VAE and blended over
# the floorplan render. The detection target is NOT derived from those pixels:
# it is the dataset's own labels.txt box for the component. Because labels.txt
# is fixed per sample, the label set never changes across epochs - only the
# pixels do (fresh seed per epoch), so Ultralytics' once-read labels stay
# correct without any in-memory patching.

[default]
# ---- Which component this run detects ----
# Key into [COMPONENT_VARIANTS] in config.toml: "tv", "showcase" or
# "dining_set". The command line may override it (--component) so the three
# runs can be launched without editing this file.
MISSING_COMPONENT = "dining_set"

# ---- Reproducibility ----
# The train draw for epoch E uses seed = BASE_SEED + E (E = 0 is the
# pre-training draw, then one redraw after every epoch but the last). Val and
# test are drawn ONCE each with their own fixed seeds, so their pixels - and
# therefore every metric read off them - never move during a run.
BASE_SEED = 1234
VAL_RENDER_SEED = 90210
TEST_RENDER_SEED = 90211

# ---- Splits ----
# Fraction of the validate split's LAYOUT FAMILIES used for validation; the
# remainder becomes test. Families are split, never individual samples, so no
# augmented variant of a val layout can appear in test. 0.5 on the current
# dataset gives ~9.9k val and ~9.9k test samples out of 19,920.
VAL_FAMILY_FRACTION = 0.5
# Caps over the source pool per split; negative keeps every sample. The default
# run uses ALL available data (~69,776 train from work/train, and the carved
# val/test halves). Lower these only to smoke-test the pipeline: a real run
# with a capped train set silently trains on a subset.
SOURCE_SAMPLE_CAP = -1
VAL_SAMPLE_CAP = -1
TEST_SAMPLE_CAP = -1

# ---- Image generation ----
# Square side length of the generated image. Must equal all three frozen VAEs'
# IMAGE_SIZE (all are 256); fails fast otherwise.
RENDER_IMAGE_SIZE = 256
# Blend weight of the generated furniture foreground over the floorplan base
# (same helper the mask_diffusion and YOLO grids use).
RENDER_OVERLAY_ALPHA = 0.6
# Chains per reverse-chain call. Fixed because it fixes the RNG stream:
# each chunk is reseeded from seed + CHAIN_SEED_STRIDE * chunk index, so a
# rerun reproduces identical pixels.
RENDER_CHAIN_CHUNK = 16384
# Latents decoded + rendered per pass. This is the memory bound: one chunk's
# decoder logits are RENDER_DECODE_CHUNK x 11 x 256 x 256 float32 (~1.5 GB at
# 512), and that tensor is consumed immediately by the renderer.
RENDER_DECODE_CHUNK = 512
# Threads decoding masks, writing PNG/label files and scoring agreement, off the
# MPS thread. PNG encode/decode and cv2 release the GIL, so these overlap with
# the MPS sampling of the next chunk.
RENDER_IO_WORKERS = 6
# PNG zlib level 0-9 for written images (pixels identical either way).
RENDER_PNG_COMPRESS_LEVEL = 1
# True = condition latents from the encoder mean (deterministic per sample);
# false = reparameterized samples (extra stochasticity on top of the draw).
RENDER_USE_MU_ONLY = true
# Spacing between the seeds of consecutive reverse-chain chunks. A fixed value
# (not a magic number scattered in .py) so two chunks can never share a stream.
CHAIN_SEED_STRIDE = 7919

# ---- YOLO26 finetune ----
# Generated images are VAE-native 256px, so IMG_SIZE=416 (not 640) avoids a
# 2.5x upscale of VAE blur artifacts and cuts MPS/CPU cost.
YOLO_MODEL = "yolo26n.pt"
IMG_SIZE = 416
BATCH_SIZE = 16
NUM_EPOCHS = 30
# LR0=0.01 is the Ultralytics default tuned for OPTIMIZER="auto" (MuSGD/SGD
# family for YOLO26); keep the pair pinned together, change jointly.
LR0 = 0.01
OPTIMIZER = "auto"
PATIENCE = 10
# Must stay 0. The per-epoch callback rewrites the train PNGs from this process;
# with worker processes Ultralytics would hand out forked file handles for the
# previous epoch's pixels. Labels are read once and never rewritten, so this is
# the only worker-safety constraint.
WORKERS = 0
# Mirrored telemetry rows per epoch (1 = every epoch, live).
TELEMETRY_INTERVAL = 1
# Ultralytics accumulates gradients over round(nbs / batch) batches and steps
# the optimizer once per group. Pinning NOMINAL_BATCH_SIZE = BATCH_SIZE keeps
# accumulation at 1 so every batch updates the weights (the default nbs=64 with
# batch=16 would step only once every 4 batches and can starve a small train
# set outright; validate_training_budget fails fast when it would).
NOMINAL_BATCH_SIZE = 16

# ---- Target/agreement telemetry ----
# The generator places the component where it thinks it belongs, which is not
# always where labels.txt says it is. Rather than dropping or relabelling those
# samples (see missing_yolo/README.md), the disagreement is MEASURED every
# epoch: each sample's box-IoU between the generated component mask and its
# labels.txt box, plus the fraction of samples above these thresholds. A run
# whose agreement fraction collapses is a run with injected label noise, and
# these columns are how that becomes visible.
AGREEMENT_BOX_IOU_THRESHOLDS = [0.1, 0.3, 0.5, 0.7]

# ---- End-of-epoch overlays (reuses YOLO/overlay.py) ----
# Fixed, seeded subset of the val split visualized at the end of EVERY epoch:
# the same stems each epoch so pixel changes and improving boxes stay
# comparable across the run.
EPOCH_OVERLAY_STEMS = 32
# Confidence for the epoch-end predictions. 0.25 is the threshold a
# well-trained detector is usually judged at, so the panel shows what
# evaluation counts; an undertrained model simply shows GT-only images (its
# peak confidence is logged each epoch). Do not lower it to near-zero: at 0.001
# an undertrained model emits its full 300-box NMS output and the snapshot
# becomes unreadable red spaghetti that hides the GT boxes.
EPOCH_OVERLAY_CONF = 0.25
# Cap on predicted boxes drawn per image, highest-confidence first, so an
# early-epoch model cannot bury the image under hundreds of boxes.
EPOCH_OVERLAY_MAX_BOXES = 25
# Columns of the per-epoch montage grid (rows follow from the stem count).
EPOCH_OVERLAY_MONTAGE_COLS = 4

# ---- Standalone validation report (missing_yolo/validate.py) ----
# The report ALWAYS regenerates the val half of SOURCE_VAL_SPLIT_DIR from the
# frozen generator, then runs the matching missing_yolo weights over every
# image. Nothing is trained in this pass.
#
# Ultralytics validation pass. VAL_CONF=0.001 keeps the low-confidence tail in
# the saved prediction files (save_txt=True); the report then thresholds those
# predictions itself, so one inference pass supplies both the official mAP and
# every thresholded number.
VALIDATION_BATCH_SIZE = 16
VALIDATION_VAL_CONF = 0.001
VALIDATION_NMS_IOU = 0.7
VALIDATION_MAX_DETECTIONS = 300
# Maximum predicted boxes drawn per sample image (highest confidence first).
VALIDATION_MAX_BOXES = 25
# Confidence thresholds reported in the thresholded tables and per-image CSV.
# The first value is the primary threshold used for the images and manifest.
VALIDATION_CONF_THRESHOLDS = [0.25, 0.5, 0.75]
VALIDATION_REPORT_CONF = 0.25
# Confidence sweep for the dedicated precision table (precision_table.csv and
# tables.txt). This is deliberately finer than VALIDATION_CONF_THRESHOLDS so
# precision/recall can be read as a curve instead of at three points.
VALIDATION_PRECISION_THRESHOLDS = [
    0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
    0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95,
]
# Greedy match threshold for TP/FP/FN, identical to the evaluator's box rule.
VALIDATION_MATCH_IOU = 0.5
# Balanced visual panel per component: 12 positive + 12 negative samples.
VALIDATION_SAMPLE_POSITIVES = 12
VALIDATION_SAMPLE_NEGATIVES = 12
VALIDATION_SAMPLE_SEED = 1234
VALIDATION_MONTAGE_COLS = 6

# ---- Ultralytics internal augmentation overrides ----
# The per-epoch generation already supplies the variation, so
# mosaic/mixup (multi-image composites) and the built-in flips are disabled;
# photometric hsv jitter is kept at Ultralytics defaults. Note cache must stay
# False: the train PNGs are rewritten every epoch and any snapshot cache would
# freeze the first epoch's pixels forever (the runner passes cache=False).
MOSAIC = 0.0
MIXUP = 0.0
COPY_PASTE = 0.0
FLIPLR = 0.0
FLIPUD = 0.0
HSV_H = 0.015
HSV_S = 0.7
HSV_V = 0.4