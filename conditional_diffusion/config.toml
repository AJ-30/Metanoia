# Non-model configuration for conditional diffusion: floorplan condition ->
# arrangement generation in frozen mask_VAE latent spaces.
#
# The model learns p(arrangement_latent | floorplan_latent) with a conditional
# DDPM denoiser. Both latent spaces come from FROZEN mask_VAE checkpoints that
# are never trained here:
#   COND_VAE_CHECKPOINT_PATH   -> floorplan mask VAE (condition encoder)
#   TARGET_VAE_CHECKPOINT_PATH -> arrangement/furniture mask VAE (diffusion
#      space + arrangement decoder for visualization)

[default]
DEBUG_LOG_FILE_PATH = "./debug_logs/conditional_diffusion.log"
MODEL_SAVE_PATH = "./conditional_diffusion/models/"
TELEMETRY_LOG_DIRECTORY = "./conditional_diffusion/telemetry_logs/"
OUTPUT_SAMPLES_DIRECTORY = "./conditional_diffusion/outputs/"
DEVICE = "mps"

# Split folders of the folder-per-sample dataset: each holds one sub-folder per
# sample containing BOTH floorplan_segmentation.png and
# furniture_segmentation.png. Only samples providing both masks are used, so
# every training pair (floorplan, arrangement) comes from the same layout.
TRAIN_IMAGES_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/train"
TEST_IMAGES_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/test"

# Frozen mask_VAE checkpoints. Rebuilt from each checkpoint's own
# hyperparameters, so these stay usable even after mask_VAE config moved on.
# Both are latest-generation single-channel-encoder runs (128-dim latents).
# mint-akita epoch 200 = floorplan VAE (18 channels).
COND_VAE_CHECKPOINT_PATH = "./mask_VAE/models/mask_vae_mint-akita_epoch_200.pt"
# chief-yeti epoch 555 = arrangement/furniture VAE (11 channels).
TARGET_VAE_CHECKPOINT_PATH = "./mask_VAE/models/mask_vae_chief-yeti_epoch_555.pt"

# Mask filenames inside each sample folder. Kept in TOML so no filename is
# hardcoded in Python.
COND_MASK_FILE = "floorplan_segmentation.png"
TARGET_MASK_FILE = "furniture_segmentation.png"

# Full rendered image shown as the top row of the reconstruction grid.
FULL_IMAGE_FILE = "full.png"

# Directory for cached (condition, target) latent pairs encoded once with the
# frozen VAEs. A matching cache is reused on the next run instead of
# re-encoding all 80k pairs; any config/dataset/checkpoint change invalidates
# it automatically via the stored fingerprint.
LATENT_CACHE_DIR = "./conditional_diffusion/latent_cache/"

# Directory holding the color index JSONs (dataset root, next to split dirs).
# Falls back to the parent of TRAIN_IMAGES_DIR when a file is missing there.
MASK_COLOR_INDEX_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work"
COND_COLOR_INDEX_FILE = "floorplan_color_index.json"
TARGET_COLOR_INDEX_FILE = "furniture_color_index.json"

[debug]
IS_DEBUG = true
IS_DEBUG_TORCH = false

[prod]
IS_DEBUG = false
IS_DEBUG_TORCH = false
