[default]
DEBUG_LOG_FILE_PATH = "./debug_logs/yolo.log"
MODEL_SAVE_PATH = "./YOLO/models/"
TELEMETRY_LOG_DIRECTORY = "./YOLO/telemetry_logs/"
OUTPUT_SAMPLES_DIRECTORY = "./YOLO/outputs/"
# Generated YOLO dataset (2x augmented train + mirrored val/test) and its
# Ultralytics index files. This root is separate from any earlier build so a
# stale labels/*.cache or data.yaml from a different AUG_FACTOR is never reused.
AUGMENTED_DATASET_ROOT = "/Users/aatmaj/FurnitureArranger/datasets/yolo_augmented"
DATA_YAML_PATH = "/Users/aatmaj/FurnitureArranger/datasets/yolo_augmented/data.yaml"
AUGMENT_MANIFEST_PATH = "/Users/aatmaj/FurnitureArranger/datasets/yolo_augmented/augment_manifest.csv"
VAE_MODELS_DIR = "./VAE/models/"
VAE_RUN_ID = "next-collie"
DEVICE = "mps"
# Source split folders of the folder-per-sample dataset. Each holds one
# sub-folder per sample containing full.png, floorplan_only.png and
# labels.txt — there is no separate images/ or labels/ directory anymore.
# Which render is read is set by SOURCE_IMAGE_FILE_NAME in
# YOLO/augment_hyperparameters.toml.
SOURCE_TRAIN_SPLIT_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/train"
SOURCE_VAL_SPLIT_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/validate"
SOURCE_TEST_SPLIT_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/test"

[debug]
IS_DEBUG = true
IS_DEBUG_TORCH = false

[prod]
IS_DEBUG = false
IS_DEBUG_TORCH = false
