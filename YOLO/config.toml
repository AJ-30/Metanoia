[default]
DEBUG_LOG_FILE_PATH = "./debug_logs/yolo.log"
MODEL_SAVE_PATH = "./YOLO/models/"
TELEMETRY_LOG_DIRECTORY = "./YOLO/telemetry_logs/"
OUTPUT_SAMPLES_DIRECTORY = "./YOLO/outputs/"
# Generated YOLO dataset (2x augmented train + mirrored val/test) and its
# Ultralytics index files. This root is separate from any earlier build so a
# stale labels/*.cache or data.yaml from a different AUG_FACTOR is never reused.
AUGMENTED_DATASET_ROOT = "/Users/aatmaj/Downloads/datasets/yolo_augmented"
DATA_YAML_PATH = "/Users/aatmaj/Downloads/datasets/yolo_augmented/data.yaml"
AUGMENT_MANIFEST_PATH = "/Users/aatmaj/Downloads/datasets/yolo_augmented/augment_manifest.csv"
VAE_MODELS_DIR = "./VAE/models/"
VAE_RUN_ID = "next-collie"
DEVICE = "mps"
# Source split folders of the folder-per-sample dataset. Each holds one
# sub-folder per sample containing full.png, floorplan_only.png and
# labels.txt — there is no separate images/ or labels/ directory anymore.
# Which render is read is set by SOURCE_IMAGE_VARIANT below.
SOURCE_TRAIN_SPLIT_DIR = "/Users/aatmaj/Downloads/datasets/work/train"
SOURCE_VAL_SPLIT_DIR = "/Users/aatmaj/Downloads/datasets/work/validate"
SOURCE_TEST_SPLIT_DIR = "/Users/aatmaj/Downloads/datasets/work/test"

# Which render of each sample folder the YOLO pipeline reads. The dataset stores
# every render of a layout side by side, so this key is the only switch needed.
# YOLO is trained on the full render, because the boxes in labels.txt describe
# the full furniture set:
#   "full_png"    -> full.png           (furniture + floorplan)
#   "layout_only" -> floorplan_only.png (rooms only, no furniture)
# no_tv.png is deliberately absent from the table below: it drops the tv pixels
# while labels.txt still lists the tv box, so its boxes would mismatch its pixels.
SOURCE_IMAGE_VARIANT = "full_png"

# Annotation file every source sample folder must carry alongside the render
# above ("<Class_Name> cx cy w h", one box per line, normalized).
SOURCE_LABEL_FILE_NAME = "labels.txt"

# Variant name -> render filename inside each sample folder. Kept in TOML so the
# filenames are never hardcoded in Python. Both stages of the pipeline read this
# table, so each model keeps its own copy: VAE/config.toml and
# Diffusion/config.toml carry the same entries. Keep them in sync.
[default.IMAGE_VARIANTS]
full_png = "full.png"
layout_only = "floorplan_only.png"

[debug]
IS_DEBUG = true
IS_DEBUG_TORCH = false

[prod]
IS_DEBUG = false
IS_DEBUG_TORCH = false
