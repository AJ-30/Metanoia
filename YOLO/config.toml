# YOLO stage configuration (YOLO/run.py, via ./train_YOLO.sh).
# Paths, devices and dataset locations only - training/rendering numbers live
# in YOLO/hyperparameters.toml.

[default]
DEBUG_LOG_FILE_PATH = "./debug_logs/yolo.log"
MODEL_SAVE_PATH = "./YOLO/models/"
TELEMETRY_LOG_DIRECTORY = "./YOLO/telemetry_logs/"
OUTPUT_SAMPLES_DIRECTORY = "./YOLO/outputs/"
# Live-diffusion YOLO dataset root, regenerated in place every run:
#   images/{train,val,test}, labels/{train,val,test}, data.yaml,
#   redraw_manifest.csv, .render_signature sidecars.
# Train PNGs are rewritten from fresh diffusion draws at the end of every
# epoch; val/test hold deterministic GT overlays (floorplan + GT furniture
# arrangement, no diffusion) so early stopping and the final report stay
# stable. A fresh root (v2) is used so no pixels or labels from an older
# pipeline can be silently reused.
LIVE_DATASET_ROOT = "/Users/aatmaj/Downloads/datasets/yolo_live_v2"
LIVE_DATA_YAML_PATH = "/Users/aatmaj/Downloads/datasets/yolo_live_v2/data.yaml"
LIVE_MANIFEST_PATH = "/Users/aatmaj/Downloads/datasets/yolo_live_v2/redraw_manifest.csv"
# Folder-per-sample mask dataset feeding the pipeline. Each sample folder
# carries the floorplan mask (diffusion condition), the arrangement mask
# (deterministic val/test overlays) and the color index JSONs sit next to
# the split folders.
LIVE_SOURCE_TRAIN_SPLIT_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/train"
LIVE_SOURCE_VAL_SPLIT_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/validate"
LIVE_SOURCE_TEST_SPLIT_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/test"
# Frozen floorplan->arrangement diffusion checkpoint (TV-inclusive arrangement
# vocabulary). The two frozen mask VAEs must be the ones that diffusion run
# trained against.
COND_DIFFUSION_CHECKPOINT_PATH = "./conditional_diffusion/models/conditional_diffusion_strong-fawn_epoch_2480.pt"
COND_VAE_CHECKPOINT_PATH = "./mask_VAE/models/mask_vae_mint-akita_floorplan_epoch_200.pt"
TARGET_VAE_CHECKPOINT_PATH = "./mask_VAE/models/mask_vae_chief-yeti_epoch_arrangement_555.pt"
# Mask filenames inside each source sample folder.
COND_MASK_FILE = "floorplan_segmentation.png"
TARGET_MASK_FILE = "furniture_segmentation.png"
# Color index JSONs rendering the overlays (dataset root, next to split dirs).
MASK_COLOR_INDEX_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work"
COND_COLOR_INDEX_FILE = "floorplan_color_index.json"
TARGET_COLOR_INDEX_FILE = "furniture_color_index.json"
DEVICE = "mps"

[debug]
IS_DEBUG = true
IS_DEBUG_TORCH = false

[prod]
IS_DEBUG = false
IS_DEBUG_TORCH = false
