# YOLO training/rendering hyperparameters (YOLO/runner.py, via ./train_YOLO.sh).
# Every tunable constant lives here (never hardcoded in .py files).
#
# Pipeline in one paragraph: the whole folder-per-sample mask dataset is used
# every epoch. Train images are redrawn live from the frozen
# floorplan->arrangement diffusion model at the end of every epoch (fresh
# noise per epoch, GT floorplan as condition), and the boxes are derived from
# the arrangement that was actually drawn, so image and target always agree.
# Val/test are deterministic GT overlays rendered once. At the end of every
# epoch a fixed set of val images is saved with ground-truth (green) and
# predicted (red) boxes overlaid on the floorplan+furniture image.

[default]
# ---- Reproducibility ----
# Epoch E draws with seed = BASE_SEED + E (E = 0 before the first epoch, then
# 1..NUM_EPOCHS for the redraws at each epoch end). The chain runs on MPS with
# a per-epoch reseeded generator, so a rerun redraws identical pixels.
BASE_SEED = 1234

# ---- Dataset ontology ----
# CLASS_NAMES is the label vocabulary Ultralytics trains against: index ==
# class id, and data.yaml is written from this exact order. It must match what
# the arrangement mask can express: the mask vocabulary is 10 classes
# (sofa, tv, dining_set, side_table, showcase, couch, chair, center_table,
# vase_table, sofa_cum_bed). The source dataset's three Dining_table_* sizes
# are indistinguishable in mask and render, so they fold onto one class via
# CLASS_ALIASES below; an ontology the mask cannot express aborts the run
# instead of silently training on a shifted class space.
CLASS_NAMES = ["Center_table", "Chair", "Couch", "Dining_table", "Showcase", "Side_table", "Sofa", "Sofa_cum_bed", "TV", "Vase_table"]

# ---- YOLO26 finetune ----
# Train images are VAE-native 256px, so IMG_SIZE=416 (not 640) avoids a 2.5x
# upscaling of VAE blur artifacts and cuts MPS/CPU cost.
YOLO_MODEL = "yolo26n.pt"
IMG_SIZE = 416
BATCH_SIZE = 16
NUM_EPOCHS = 30
# LR0=0.01 is the Ultralytics default tuned for OPTIMIZER="auto" (MuSGD/SGD
# family for YOLO26); keep the pair pinned together, change jointly.
LR0 = 0.01
OPTIMIZER = "auto"
PATIENCE = 10
WORKERS = 0
TELEMETRY_INTERVAL = 1
# Ultralytics accumulates gradients over round(nbs / batch) batches and steps
# the optimizer once per group. Pinning NOMINAL_BATCH_SIZE = BATCH_SIZE keeps
# accumulation at 1 so every batch updates the weights (the default nbs=64
# with batch=16 would step only once every 4 batches and can starve a small
# train set outright; validate_training_budget fails fast when it would).
NOMINAL_BATCH_SIZE = 16

# ---- Live per-epoch redraw (YOLO/dataset.py LiveEpochRedrawer) ----
# Blend weight of drawn furniture foreground over the floorplan base (same
# overlay helper the conditional-diffusion grids use).
REDRAW_OVERLAY_ALPHA = 0.6
# Square side length of the overlay domain. Must equal both frozen VAEs'
# IMAGE_SIZE (both are 256); fails fast otherwise.
REDRAW_IMAGE_SIZE = 256
# Latents sampled per diffusion-chain call. Fixed so the seeded RNG stream is
# chunked identically every run (reproducibility).
REDRAW_SAMPLE_CHUNK = 16384
# Images decoded + rendered per MPS pass (bounds logit memory: 512 x 11
# channels x 256 x 256 float32 ~ 1.5 GB).
REDRAW_RENDER_CHUNK = 512
# Threads deriving boxes (cv2) and writing PNG/label files, and loading the
# floorplan masks, off the MPS thread. PNG encode/decode and cv2 release the
# GIL, so these overlap with the MPS sampling/decoding of the next chunk.
REDRAW_IO_WORKERS = 6
# Smallest connected region (pixels, in the 256x256 domain) counted as a
# furniture instance when deriving boxes from a draw; below this the decoder
# leaves speckle that would otherwise become spurious boxes.
REDRAW_MIN_INSTANCE_AREA = 200
# PNG zlib level 0-9 for rendered images (pixels identical either way).
REDRAW_PNG_COMPRESS_LEVEL = 1
# True = condition latents from encoder mu (deterministic per floorplan);
# false = reparameterized samples (extra stochasticity on top of the draw).
REDRAW_USE_MU_ONLY = true

# ---- Dataset sizing ----
# Caps over the source pool per split; negative keeps every sample. The
# default run uses ALL available data every epoch (~69,776 train /
# ~19,920 val / ~10,043 test). Lower these only to smoke-test the pipeline
# quickly: a real run with a capped train set silently trains on a subset.
SOURCE_SAMPLE_CAP = -1
VAL_SAMPLE_CAP = -1
TEST_SAMPLE_CAP = -1

# ---- End-of-epoch overlays (YOLO/overlay.py) ----
# Fixed, seeded subset of the val split visualized at the end of EVERY epoch:
# the same stems each epoch so pixel changes and improving boxes stay
# comparable across the run.
EPOCH_OVERLAY_STEMS = 32
# Confidence for the epoch-end predictions. Defaults to 0.25, the threshold a
# well-trained detector is usually judged at, so the panel shows what
# evaluation counts; an undertrained model simply shows GT-only images (its
# peak confidence is logged each epoch). Lower it if you want to watch the
# first (low-confidence) detections appear, but not to near-zero: at 0.001 an
# undertrained model emits its full 300-box NMS output and the snapshot
# becomes unreadable red spaghetti that hides the GT boxes.
EPOCH_OVERLAY_CONF = 0.25
# Cap on predicted boxes drawn per image, highest-confidence first, so an
# early-epoch model cannot bury the image under hundreds of boxes.
EPOCH_OVERLAY_MAX_BOXES = 25
# Columns of the per-epoch montage grid (rows follow from the stem count).
EPOCH_OVERLAY_MONTAGE_COLS = 4

# ---- Offline inference viewer (YOLO/predict.py) ----
# Deliberately far below 0.25: a lightly-trained model peaks around 1e-3, so
# at a high threshold the viewer would report zero detections and look broken
# rather than merely untrained. The tool prints the peak confidence it
# actually saw, so "no boxes" is always distinguishable from "model is
# broken".
PREDICT_CONF = 0.001
PREDICT_MAX_BOXES = 20
# Default images to show when --limit is not given (0 = all).
PREDICT_LIMIT = 12

# ---- Ultralytics internal augmentation overrides ----
# The live diffusion draws already supply the variation, so mosaic/mixup
# (multi-image composites) and the built-in flips are disabled; photometric
# hsv jitter is kept at Ultralytics defaults. Note cache must stay False: the
# train PNGs are rewritten every epoch and any snapshot cache would freeze the
# first epoch's pixels forever (the trainer passes cache=False explicitly).
MOSAIC = 0.0
MIXUP = 0.0
COPY_PASTE = 0.0
FLIPLR = 0.0
FLIPUD = 0.0
HSV_H = 0.015
HSV_S = 0.7
HSV_V = 0.4

# Mask/source furniture name -> CLASS_NAMES entry, applied when mapping the
# arrangement mask classes onto YOLO ids. Names not listed here must match a
# CLASS_NAMES entry after normalization (lowercase alphanumeric) or the run
# aborts. Declared last so this table header cannot swallow the scalar keys.
[default.CLASS_ALIASES]
"dining_set" = "Dining_table"
