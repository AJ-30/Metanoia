[default]
# Must match the LATENT_DIM stored inside VAE_CHECKPOINT_PATH. The runner
# fails fast on mismatch so a wrong checkpoint can never train silently.
# VAE_CHECKPOINT_PATH points at the next-collie run (256-dim, 3x3 kernels),
# the same frozen encoder YOLO augments with, so both stages share one domain.
LATENT_DIM = 256
# Denoiser MLP capacity.
HIDDEN_DIM = 1024
NUM_LAYERS = 5
# Sinusoidal timestep embedding size and period.
TIME_EMB_DIM = 256
TIME_MAX_PERIOD = 10000
# DDPM forward schedule (linear betas, Ho et al. 2020).
NUM_TIMESTEPS = 1000
BETA_START = 0.0001
BETA_END = 0.02
# Optimization.
LEARNING_RATE = 0.0003
BATCH_SIZE = 128
NUM_EPOCHS = 2000
SEED = 42
# Logging / checkpointing.
TELEMETRY_INTERVAL = 5
CHECKPOINT_INTERVAL = 10
# Data loading (same conventions as VAE/hyperparameters.toml).
NUM_WORKERS = 0
MAX_SAMPLES = -1
PRELOAD_IMAGES = true
BACKGROUND_COLOR = [255, 255, 255, 255]
# Composite noise-prediction loss: MSE + L1_WEIGHT * L1 on the predicted noise.
L1_WEIGHT = 0.5
# Sampling / evaluation grids shown on the dashboard.
NUM_GEN_SAMPLES = 16
GRID_NROW = 4
TEST_LOSS_SAMPLES = 100
# Latent handling: true = train on the encoder mean (deterministic);
# false = train on reparameterized samples (stochastic augmentation).
USE_MU_ONLY = true
# Standardize latents with dataset mean/std before diffusion (recommended:
# keeps the unit-variance noise schedule well conditioned).
NORMALIZE_LATENTS = true
LATENT_STATS_SAMPLES = 2048
LATENT_STD_MIN = 0.001

# Which render of each sample folder the diffusion model learns from. The
# dataset stores every render of a layout side by side, so this key is the only
# switch needed. Diffusion is trained on the full render:
#   "full_png"    -> full.png           (furniture + floorplan)
#   "layout_only" -> floorplan_only.png (rooms only, no furniture)
TRAIN_IMAGE_VARIANT = "full_png"

# Variant name -> render filename inside each sample folder. Kept in TOML so the
# filenames are never hardcoded in Python.
# NOTE: VAE/hyperparameters.toml carries a copy of this table; keep in sync.
[default.IMAGE_VARIANTS]
full_png = "full.png"
layout_only = "floorplan_only.png"
