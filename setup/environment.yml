name: venv

channels:
- pytorch
- conda-forge
- defaults

dependencies:
- python=3.13
- pytorch
- torchvision
- torchaudio
- matplotlib
- numpy
- pillow
- flask
- pip

- pip:
  - petname
  - loguru
  - tqdm  # progress bars for the YOLO augmentation loop
  - ultralytics>=8.3.0  # YOLO26 finetune (Mac MPS/CPU compatible, Roboflow-supported)
  # Wall/door/window completion step of the demo (Reconstruction package, mounted by frontend/completion.py)
  - scipy
  - shapely
  - scikit-image
  - fastapi
  - uvicorn
  - python-multipart
  - a2wsgi
