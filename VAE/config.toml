# Non-model configuration for the VAE: device, paths, logging, telemetry and the
# dataset render variant. Model architecture and training hyperparameters live in
# VAE/hyperparameters.toml.

[default]
DEBUG_LOG_FILE_PATH = "./debug_logs/vae.log"
MODEL_SAVE_PATH = "./VAE/models/"
TELEMETRY_LOG_DIRECTORY = "./VAE/telemetry_logs/"
OUTPUT_SAMPLES_DIRECTORY = "./VAE/outputs/"
DEVICE = "mps"
# Split folders of the folder-per-sample dataset: each holds one sub-folder per
# sample (e.g. <hash>_original/) containing full.png, floorplan_only.png and
# labels.txt. Which render is read is set by TRAIN_IMAGE_VARIANT below.
TRAIN_IMAGES_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/train"
TEST_IMAGES_DIR = "/Users/aatmaj/FurnitureArranger/datasets/work/test"

# Which render of each sample folder the VAE learns from. The dataset stores
# every render of a layout side by side, so this key is the only switch needed.
#   "full_png"    -> full.png           (furniture + floorplan)
#   "layout_only" -> floorplan_only.png (rooms only, no furniture)
TRAIN_IMAGE_VARIANT = "full_png"

# Variant name -> render filename inside each sample folder. Kept in TOML so the
# filenames are never hardcoded in Python. Both stages of the pipeline read this
# table, so each model keeps its own copy: Diffusion/config.toml and
# YOLO/config.toml carry the same entries. Keep them in sync.
[default.IMAGE_VARIANTS]
full_png = "full.png"
layout_only = "floorplan_only.png"

[debug]
IS_DEBUG = true
IS_DEBUG_TORCH = false

[prod]
IS_DEBUG = false
IS_DEBUG_TORCH = false
